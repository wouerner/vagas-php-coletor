<!-- Google Analytics com Consent Mode (LGPD): inserido pelo site (web/src/Seo.php) antes de </head> quando
     VAGAS_GA_ID está definido. Sem aceite, o GA não grava cookies (só sinais anônimos);
     a escolha fica no localStorage ("ga-consent": granted | denied). -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  (function () {
    let choice = null;
    try { choice = localStorage.getItem("ga-consent"); } catch (e) {}
    gtag("consent", "default", {
      ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied",
      analytics_storage: choice === "granted" ? "granted" : "denied",
    });
    gtag("js", new Date());
    gtag("config", "{GA_ID}");
    if (choice) return;
    addEventListener("DOMContentLoaded", () => {
      const bar = document.createElement("div");
      bar.id = "ga-consent";
      bar.setAttribute("role", "region");
      bar.setAttribute("aria-label", "Cookies");
      bar.innerHTML =
        '<p>Usamos cookies do Google Analytics para saber quantas pessoas visitam o site. ' +
        'Nenhum dado é usado para anúncios.</p>' +
        '<div><button type="button" data-v="denied">Recusar</button>' +
        '<button type="button" data-v="granted" class="primary">Aceitar</button></div>';
      bar.addEventListener("click", e => {
        const v = e.target.dataset && e.target.dataset.v;
        if (!v) return;
        try { localStorage.setItem("ga-consent", v); } catch (err) {}
        gtag("consent", "update", { analytics_storage: v });
        bar.remove();
      });
      document.body.append(bar);
    });
  })();
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={GA_ID}"></script>
<style>
  #ga-consent { position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 1000;
    max-width: 640px; margin: 0 auto; display: flex; gap: 12px 16px; align-items: center;
    flex-wrap: wrap; padding: 12px 16px; border-radius: 10px;
    background: var(--surface, #fff); color: var(--text, #1d1d2b);
    border: 1px solid var(--line, #e3e3ec); box-shadow: 0 4px 16px rgb(0 0 0 / .12);
    font-size: 14px; }
  #ga-consent p { margin: 0; flex: 1 1 280px; color: var(--muted, #5d6070); }
  #ga-consent div { display: flex; gap: 8px; }
  #ga-consent button { font: inherit; cursor: pointer; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--line, #e3e3ec); background: transparent; color: inherit; }
  #ga-consent button.primary { background: var(--accent, #5b5fa0); border-color: transparent;
    color: var(--surface, #fff); }
</style>
