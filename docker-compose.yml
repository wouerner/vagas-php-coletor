    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: America/Sao_Paulo
      VAGAS_TENANT: lua
      VAGAS_MCP_ENABLED: "false"
      VAGAS_POSTS_ENABLED: "false"
      VAGAS_LINKEDIN_DAILY_POST: "false"
      VAGAS_INDEXING_ENABLED: "false"
      VAGAS_MAX_AGE_HOURS: "${VAGAS_MAX_AGE_HOURS:-72}"
      DATABASE_URL: "mysql://vagas:${MYSQL_PASSWORD:-vagas}@mysql:3306/vagas"
    volumes:
      - ./data/lua:/app/data      # config do agendador deste tenant

  # Coletor do tenant java: igual ao collector-ruby, com VAGAS_TENANT=java. Os termos de
  # busca do Java vêm da base (collector_config).
