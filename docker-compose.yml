# Monorepo: coletor em Python (collector/, serviço vagas-php; collector-ruby,
# collector-lua, collector-java, collector-python, collector-nodejs, collector-dotnet, collector-go, collector-frontend e collector-mobile para os
# tenants ruby, lua, java, python, nodejs, dotnet, go, frontend e mobile)
# e site em PHP (web/,
# serviço web). Conversam só pelo MySQL, uma base multi-tenant (docs/contrato-base.md).
# Portas publicadas (todas mudam por variável; veja o README):
#   site 8780, MCP 8766, noVNC 6081, VNC 5901, MySQL 3307
services:
  # Base local. Em produção (Coolify) o MySQL fica em outro servidor: só DATABASE_URL muda.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: UTC
      MYSQL_DATABASE: vagas
      MYSQL_USER: vagas
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-vagas}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-vagas-root}"
    ports:
      - "127.0.0.1:${MYSQL_PUBLISH_PORT:-3307}:3306"   # para inspecionar com um cliente
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uvagas", "-p${MYSQL_PASSWORD:-vagas}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Coletor (Python): coleta agendada, filtro, MCP, post diário e Indexing API.
  vagas-php:
    build: ./collector
    image: vagas-php-collector
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    user: "${UID:-1000}:${GID:-1000}"
    shm_size: 1gb
    environment:
      TZ: America/Sao_Paulo
      MCP_HOST: 0.0.0.0           # dentro do container; a porta só é publicada no localhost
      MCP_PORT: "8000"
      LINKEDIN_HEADLESS: "false"  # navegador no display virtual, visível pelo noVNC
      VAGAS_MAX_AGE_HOURS: "${VAGAS_MAX_AGE_HOURS:-72}"   # idade máxima das vagas
      DATABASE_URL: "mysql://vagas:${MYSQL_PASSWORD:-vagas}@mysql:3306/vagas"
    ports:
      # Só em localhost do servidor: de fora, use túnel SSH.
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8766}:8000"     # MCP (http://localhost:8766/mcp)
      - "127.0.0.1:${NOVNC_PUBLISH_PORT:-6081}:6080"   # noVNC (http://localhost:6081/vnc.html)
      - "127.0.0.1:${VNC_PUBLISH_PORT:-5901}:5900"     # VNC
    volumes:
      - ./.env:/app/.env:ro
      # Perfil do Chromium com a sessão do LinkedIn (fonte post e post diário). Para usar
      # outro diretório, defina LINKEDIN_SESSION_PATH.
      - ${LINKEDIN_SESSION_PATH:-./.session}:/app/.session
      - ./data:/app/data           # config do coletor e posts diários (vagas no MySQL)

  # Coletor do tenant ruby: mesma imagem e mesma base (multi-tenant, VAGAS_TENANT=ruby;
  # docs/contrato-base.md). Só coleta: sem site, sem MCP, sem publicações do LinkedIn
  # (precisam da sessão logada), sem post diário e sem Indexing API (as páginas de vaga
  # são do site PHP). Não monta o .env: os termos de busca de PHP de lá valeriam aqui; os
  # do Ruby vêm da base (collector_config).
  collector-ruby:
    build: ./collector
    image: vagas-php-collector
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TZ: America/Sao_Paulo
      VAGAS_TENANT: ruby
      VAGAS_MCP_ENABLED: "false"
      VAGAS_POSTS_ENABLED: "false"
      VAGAS_LINKEDIN_DAILY_POST: "false"
      VAGAS_INDEXING_ENABLED: "false"
      VAGAS_MAX_AGE_HOURS: "${VAGAS_MAX_AGE_HOURS:-72}"
      DATABASE_URL: "mysql://vagas:${MYSQL_PASSWORD:-vagas}@mysql:3306/vagas"
    volumes:
      - ./data/ruby:/app/data      # config do agendador deste tenant

  # Coletor do tenant lua: igual ao collector-ruby, com VAGAS_TENANT=lua. Os termos de
  # busca do Lua vêm da base (collector_config).
