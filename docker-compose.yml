      VAGAS_TENANT: java
      VAGAS_MCP_ENABLED: "false"
      VAGAS_POSTS_ENABLED: "false"
      VAGAS_LINKEDIN_DAILY_POST: "false"
      VAGAS_INDEXING_ENABLED: "false"
      VAGAS_MAX_AGE_HOURS: "${VAGAS_MAX_AGE_HOURS:-72}"
      DATABASE_URL: "mysql://vagas:${MYSQL_PASSWORD:-vagas}@mysql:3306/vagas"
    volumes:
      - ./data/java:/app/data      # config do agendador deste tenant

  # Coletor do tenant python: igual ao collector-ruby, com VAGAS_TENANT=python. Os termos de
  # busca do Python vêm da base (collector_config).
  collector-python:
