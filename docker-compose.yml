  # Site (PHP 8.5 + Apache): lê o MySQL do coletor (só o tenant php); só grava os cliques.
  web:
    build: ./web
    image: vagas-php-web
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      TZ: America/Sao_Paulo
      VAGAS_MAX_AGE_HOURS: "${VAGAS_MAX_AGE_HOURS:-72}"
      VAGAS_RECRUITERS_MIN: "${VAGAS_RECRUITERS_MIN:-2}"
      VAGAS_RECRUITERS_HIDE: "${VAGAS_RECRUITERS_HIDE:-}"
      VAGAS_GA_ID: "${VAGAS_GA_ID:-}"
      VAGAS_SITE_URL: "${VAGAS_SITE_URL:-}"
      VAGAS_ORIGIN_TRIAL: "${VAGAS_ORIGIN_TRIAL:-}"
      DATABASE_URL: "mysql://vagas:${MYSQL_PASSWORD:-vagas}@mysql:3306/vagas"
    ports:
      # Para publicar o site na rede, use WEB_BIND=0.0.0.0 (ou um proxy reverso).
      - "${WEB_BIND:-127.0.0.1}:${WEB_PUBLISH_PORT:-8780}:8000"   # http://localhost:8780

volumes:
  mysql-data:
