  web:
    build: ./web
    restart: unless-stopped
    environment:
      SERVICE_URL_WEB_8000:          # o Coolify gera/usa o domínio do site
      # Domínio de cada site e o tenant dele; o primeiro é o padrão (Host desconhecido).
      VAGAS_SITES: ${VAGAS_SITES:-}
      # GA e token do WebMCP de cada site além do padrão (os sem sufixo valem só para ele).
      VAGAS_GA_ID_RUBY: ${VAGAS_GA_ID_RUBY:-}
      VAGAS_GA_ID_LUA: ${VAGAS_GA_ID_LUA:-}
      VAGAS_GA_ID_JAVA: ${VAGAS_GA_ID_JAVA:-}
      VAGAS_GA_ID_PYTHON: ${VAGAS_GA_ID_PYTHON:-}
      VAGAS_GA_ID_NODEJS: ${VAGAS_GA_ID_NODEJS:-}
      VAGAS_GA_ID_DOTNET: ${VAGAS_GA_ID_DOTNET:-}
      VAGAS_GA_ID_GO: ${VAGAS_GA_ID_GO:-}
      VAGAS_GA_ID_MOBILE: ${VAGAS_GA_ID_MOBILE:-}
      VAGAS_GA_ID_FRONTEND: ${VAGAS_GA_ID_FRONTEND:-}
      VAGAS_GA_ID_RUST: ${VAGAS_GA_ID_RUST:-}
      VAGAS_ORIGIN_TRIAL_RUBY: ${VAGAS_ORIGIN_TRIAL_RUBY:-}
      VAGAS_ORIGIN_TRIAL_LUA: ${VAGAS_ORIGIN_TRIAL_LUA:-}
      VAGAS_ORIGIN_TRIAL_JAVA: ${VAGAS_ORIGIN_TRIAL_JAVA:-}
      VAGAS_ORIGIN_TRIAL_PYTHON: ${VAGAS_ORIGIN_TRIAL_PYTHON:-}
      VAGAS_ORIGIN_TRIAL_NODEJS: ${VAGAS_ORIGIN_TRIAL_NODEJS:-}
      VAGAS_ORIGIN_TRIAL_DOTNET: ${VAGAS_ORIGIN_TRIAL_DOTNET:-}
      VAGAS_ORIGIN_TRIAL_GO: ${VAGAS_ORIGIN_TRIAL_GO:-}
      VAGAS_ORIGIN_TRIAL_MOBILE: ${VAGAS_ORIGIN_TRIAL_MOBILE:-}
      VAGAS_ORIGIN_TRIAL_FRONTEND: ${VAGAS_ORIGIN_TRIAL_FRONTEND:-}
      VAGAS_ORIGIN_TRIAL_RUST: ${VAGAS_ORIGIN_TRIAL_RUST:-}
      VAGAS_GA_ID: ${VAGAS_GA_ID:-}  # Google Analytics (G-...) ou Tag Manager (GTM-...); vazio: sem GA
      VAGAS_SITE_URL: ${VAGAS_SITE_URL:-}  # endereço público (canonical, sitemap); vazio: do proxy
      VAGAS_ORIGIN_TRIAL: ${VAGAS_ORIGIN_TRIAL:-}  # token do origin trial do WebMCP (Chrome); vazio: sem
      VAGAS_RECRUITERS_MIN: ${VAGAS_RECRUITERS_MIN:-2}   # /recrutadores: mínimo de vagas em 90 dias
      VAGAS_RECRUITERS_HIDE: ${VAGAS_RECRUITERS_HIDE:-}  # perfis que pediram para sair (URLs, vírgula)
      TZ: America/Sao_Paulo
      VAGAS_MAX_AGE_HOURS: ${VAGAS_MAX_AGE_HOURS:-72}
      DATABASE_URL: ${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/stats') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

