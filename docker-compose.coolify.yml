# Deploy no Coolify (build pack "Docker Compose", Docker Compose Location:
# /docker-compose.coolify.yml). Monorepo: o serviço vagas-php é o coletor (collector/,
# Python) e o web é o site (web/, PHP); conversam só pelo MySQL (docs/contrato-base.md).
# Diferenças para o docker-compose.yml local:
#   - sem arquivo .env montado: as variáveis são editadas na aba Environment Variables;
#   - MySQL 8 em outro servidor: DATABASE_URL=mysql://usuario:senha@host:3306/base
#     (obrigatória; senha com caracteres especiais vai codificada, ex.: @ -> %40);
#   - volumes nomeados no lugar de ./data e ./.session;
#   - o site não publica porta: o domínio vai no serviço "web", porta 8000;
#   - MCP desligado por padrão (VAGAS_MCP_ENABLED=false); ligado, ele e o noVNC (sem
#     senha!) ficam só no 127.0.0.1 do servidor: use túnel SSH.
services:
  vagas-php:
    build: ./collector
    command: ["serve"]
    restart: unless-stopped
    user: pwuser
    shm_size: 1gb
    environment:
      TZ: America/Sao_Paulo
      VAGAS_MCP_ENABLED: ${VAGAS_MCP_ENABLED:-false}   # true liga o servidor MCP (porta 8766)
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      LINKEDIN_HEADLESS: "false"
      VAGAS_SESSION_DIR: /app/.session
      # No build o DATABASE_URL não existe (e o build não usa a base); na execução o
      # Coolify injeta o valor real da aplicação, que vence a interpolação. Por isso
      # :- (default vazio) e não :? (falhar se vazio).
      DATABASE_URL: ${DATABASE_URL:-}
      LINKEDIN_EMAIL: ${LINKEDIN_EMAIL}
      LINKEDIN_PASSWORD: ${LINKEDIN_PASSWORD}
      VAGAS_MAX_AGE_HOURS: ${VAGAS_MAX_AGE_HOURS:-72}
      VAGAS_LINKEDIN_KEYWORDS: ${VAGAS_LINKEDIN_KEYWORDS:-php,laravel,symfony,wordpress,magento,drupal}
      VAGAS_LINKEDIN_LOCATIONS: ${VAGAS_LINKEDIN_LOCATIONS:-Brasil}
      VAGAS_LINKEDIN_INTERVAL_HOURS: ${VAGAS_LINKEDIN_INTERVAL_HOURS:-3}
      VAGAS_GUPY_TERMS: ${VAGAS_GUPY_TERMS:-php,laravel,symfony,wordpress,magento,drupal,desenvolvedor,desenvolvedora,backend,full stack}
      VAGAS_GUPY_INTERVAL_HOURS: ${VAGAS_GUPY_INTERVAL_HOURS:-2}
      VAGAS_SOLIDES_ENABLED: ${VAGAS_SOLIDES_ENABLED:-true}
      VAGAS_SOLIDES_TERMS: ${VAGAS_SOLIDES_TERMS:-php,laravel,symfony,codeigniter,wordpress,magento,drupal}
      VAGAS_SOLIDES_INTERVAL_HOURS: ${VAGAS_SOLIDES_INTERVAL_HOURS:-2}
      VAGAS_CATHO_ENABLED: ${VAGAS_CATHO_ENABLED:-true}
      VAGAS_CATHO_TERMS: ${VAGAS_CATHO_TERMS:-php,laravel,symfony,codeigniter,wordpress,magento,drupal}
      VAGAS_CATHO_INTERVAL_HOURS: ${VAGAS_CATHO_INTERVAL_HOURS:-3}
      VAGAS_REMOTAR_ENABLED: ${VAGAS_REMOTAR_ENABLED:-true}
      VAGAS_REMOTAR_TERMS: ${VAGAS_REMOTAR_TERMS:-php,laravel,symfony,wordpress,magento,drupal}
      VAGAS_REMOTAR_INTERVAL_HOURS: ${VAGAS_REMOTAR_INTERVAL_HOURS:-2}
      VAGAS_PROGRAMATHOR_ENABLED: ${VAGAS_PROGRAMATHOR_ENABLED:-true}
      VAGAS_PROGRAMATHOR_PAGES: ${VAGAS_PROGRAMATHOR_PAGES:-jobs-php,jobs-laravel,jobs-symfony,jobs-codeigniter,jobs-wordpress,jobs-magento,jobs-drupal}
      VAGAS_PROGRAMATHOR_INTERVAL_HOURS: ${VAGAS_PROGRAMATHOR_INTERVAL_HOURS:-3}
      VAGAS_COODESH_ENABLED: ${VAGAS_COODESH_ENABLED:-true}
      VAGAS_COODESH_INTERVAL_HOURS: ${VAGAS_COODESH_INTERVAL_HOURS:-3}
      VAGAS_NERDIN_ENABLED: ${VAGAS_NERDIN_ENABLED:-true}
      VAGAS_NERDIN_TERMS: ${VAGAS_NERDIN_TERMS:-php,laravel,symfony,codeigniter,wordpress,magento,drupal}
      VAGAS_NERDIN_INTERVAL_HOURS: ${VAGAS_NERDIN_INTERVAL_HOURS:-3}
      VAGAS_RECRUTEI_ENABLED: ${VAGAS_RECRUTEI_ENABLED:-true}
      VAGAS_RECRUTEI_INTERVAL_HOURS: ${VAGAS_RECRUTEI_INTERVAL_HOURS:-3}
      VAGAS_UPVAGAS_ENABLED: ${VAGAS_UPVAGAS_ENABLED:-true}
      VAGAS_UPVAGAS_TERMS: ${VAGAS_UPVAGAS_TERMS:-php,laravel,symfony,codeigniter,wordpress,magento,drupal}
      VAGAS_UPVAGAS_INTERVAL_HOURS: ${VAGAS_UPVAGAS_INTERVAL_HOURS:-2}
      VAGAS_LINKEDIN_DAILY_POST: ${VAGAS_LINKEDIN_DAILY_POST:-false}
      VAGAS_LINKEDIN_POST_TIME: ${VAGAS_LINKEDIN_POST_TIME:-09:00}
      VAGAS_LINKEDIN_POST_DAYS: ${VAGAS_LINKEDIN_POST_DAYS:-0-6}
      VAGAS_LINKEDIN_POST_SIGNATURE: ${VAGAS_LINKEDIN_POST_SIGNATURE:-}
      VAGAS_INHIRE_ENABLED: ${VAGAS_INHIRE_ENABLED:-true}
      VAGAS_INHIRE_TENANTS: ${VAGAS_INHIRE_TENANTS:-}
      VAGAS_INHIRE_INTERVAL_HOURS: ${VAGAS_INHIRE_INTERVAL_HOURS:-2}
      VAGAS_POSTS_ENABLED: ${VAGAS_POSTS_ENABLED:-false}
      VAGAS_POSTS_KEYWORDS: ${VAGAS_POSTS_KEYWORDS:-vaga php,vaga laravel,desenvolvedor php,pessoa desenvolvedora php,oportunidade php,vaga wordpress}
      VAGAS_POSTS_PER_QUERY: ${VAGAS_POSTS_PER_QUERY:-15}
      VAGAS_POSTS_INTERVAL_HOURS: ${VAGAS_POSTS_INTERVAL_HOURS:-8}
      VAGAS_POSTS_ACTIVE_HOURS: ${VAGAS_POSTS_ACTIVE_HOURS:-8-22}
      VAGAS_GITHUB_REPOS: ${VAGAS_GITHUB_REPOS:-phpdevbr/vagas,backend-br/vagas}
      VAGAS_GITHUB_INTERVAL_HOURS: ${VAGAS_GITHUB_INTERVAL_HOURS:-1}
      GITHUB_TOKEN: ${GITHUB_TOKEN-}
      # Indexing API (vagas_php/indexing.py): JSON da conta de serviço em base64. Precisa
      # estar aqui: o serviço só recebe as variáveis listadas neste arquivo, mesmo as que
      # existem no painel do Coolify. Vazio: um aviso no log e nada é enviado ao Google.
      VAGAS_INDEXING_SA_B64: ${VAGAS_INDEXING_SA_B64:-}
      VAGAS_INDEXING_ENABLED: ${VAGAS_INDEXING_ENABLED:-true}
      VAGAS_SITE_URL: ${VAGAS_SITE_URL:-}
    ports:
      - "127.0.0.1:${MCP_PUBLISH_PORT:-8766}:8000"     # MCP
      - "127.0.0.1:${NOVNC_PUBLISH_PORT:-6081}:6080"   # noVNC, para o login do LinkedIn
    volumes:
      - vagas-data:/app/data
      - linkedin-session:/app/.session

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SERVICE_URL_WEB_8000:          # o Coolify gera/usa o domínio do site
      VAGAS_GA_ID: ${VAGAS_GA_ID:-}  # Google Analytics (G-XXXXXXXXXX); vazio: sem GA
      VAGAS_SITE_URL: ${VAGAS_SITE_URL:-}  # endereço público (canonical, sitemap); vazio: do proxy
      VAGAS_ORIGIN_TRIAL: ${VAGAS_ORIGIN_TRIAL:-}  # token do origin trial do WebMCP (Chrome); vazio: sem
      VAGAS_RECRUITERS_MIN: ${VAGAS_RECRUITERS_MIN:-2}   # /recrutadores: mínimo de vagas em 90 dias
      VAGAS_RECRUITERS_HIDE: ${VAGAS_RECRUITERS_HIDE:-}  # perfis que pediram para sair (URLs, vírgula)
      TZ: America/Sao_Paulo
      VAGAS_MAX_AGE_HOURS: ${VAGAS_MAX_AGE_HOURS:-72}
      DATABASE_URL: ${DATABASE_URL:-}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/api/stats') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vagas-data:
  linkedin-session:
